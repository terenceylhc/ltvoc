  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* 3D Card Container & Flip Logic */
    .card-perspective {
      perspective: 1200px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 28px;
      background-color: #ffffff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(226, 232, 240, 0.8);
      overflow: hidden;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    /* Sprite Cropping Algorithm: 4x4 Grid with 406% Safe Zone Cropping */
    .sprite-img {
      width: 100%;
      height: 100%;
      background-size: 406% 406%;
      background-repeat: no-repeat;
      transition: transform 0.3s ease;
    }

    .card-container:hover .sprite-img {
      transform: scale(1.03);
    }

    /* Glassmorphism Controls Header */
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>

    let isAutoSpeechEnabled = true;
    let isAllFlipped = false;

    // Web Speech API Initialization
    const synth = window.speechSynthesis;

    function speakWord(text, event) {
      if (event) {
        event.stopPropagation(); // Stop card flip on button click
      }
      if (!synth) return;
      synth.cancel(); // Cancel any ongoing speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      synth.speak(utterance);
    }

    /* Calculate 4x4 Sprite Offsets for 406% Safe Zone Overflow Cropping */
    function getSpritePosition(posIdx) {
      const col = posIdx % 4;
      const row = Math.floor(posIdx / 4);
      // Offset percentages based on 4 columns x 4 rows
      const xPercent = col * (100 / 3);
      const yPercent = row * (100 / 3);
      return `${xPercent}% ${yPercent}%`;
    }

    function createCardElement(item, index) {
      const bgImage = item.grid === 1 ? rawImageG1 : rawImageG2;
      const bgPosition = getSpritePosition(item.pos_idx);

      const cardWrapper = document.createElement('div');
      cardWrapper.className = 'card-perspective w-full min-h-[460px] h-full cursor-pointer group';
      cardWrapper.setAttribute('data-index', index);

      cardWrapper.innerHTML = `

            <!-- 影像區: 16:9 比例, 406% 溢位裁切, Safe Zone Cropping -->
            <div class="relative w-full aspect-video overflow-hidden rounded-t-[28px] bg-slate-100">
              <div class="sprite-img" style="background-image: url('${bgImage}'); background-position: ${bgPosition};"></div>
              
              <!-- Badge: Word Index -->
              <div class="absolute top-3 left-3 bg-slate-900/70 backdrop-blur-md text-white text-xs font-bold px-2.5 py-1 rounded-full border border-white/20">
                #${index + 1}
              </div>
            </div>

            <!-- 文字區 (垂直置中) -->
            <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
              
              <!-- 單字: 2.5rem, font-weight: 900, color: #0f172a -->
              <h2 class="text-[2.5rem] font-[900] text-[#0f172a] leading-tight tracking-tight hover:text-amber-600 transition-colors">
                ${item.en}
              </h2>

              <!-- 音標與發音: 1.1rem #64748b 緊鄰 🔊 按鈕 -->
              <div class="flex items-center space-x-2 mt-2">
                <span class="text-[1.1rem] font-medium text-[#64748b] tracking-wide">
                  ${item.ph}
                </span>
                <button onclick="speakWord('${item.en}', event)" 
                        title="點擊發音"
                        class="w-9 h-9 rounded-full bg-amber-100 hover:bg-amber-200 text-amber-700 flex items-center justify-center transition-all transform active:scale-95 shadow-sm">
                  <i class="fa-solid fa-volume-high text-sm"></i>
                </button>
              </div>

            </div>

            <!-- 底部翻頁提醒 -->
            <div class="py-3 px-6 bg-slate-50 border-t border-slate-100 text-center text-xs font-bold text-slate-400 group-hover:text-amber-500 transition-colors flex items-center justify-center space-x-1">
              <span>點擊查看詳細口訣與解說</span>
              <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </div>

          </div>

          <!-- ==================== 反面呈現 (Textual Content Panel) ==================== -->
          <div class="card-back flex flex-col justify-center items-center p-6 text-center bg-white border border-slate-100">
            
            <div class="w-full flex-1 flex flex-col justify-center items-center space-y-3.5">
              
              <!-- 1. 單字: 3.2rem, font-weight: 900, color: #0f172a -->
              <h2 class="text-[3.2rem] font-[900] text-[#0f172a] leading-none tracking-tight">
                ${item.en}
              </h2>

              <!-- 2. 詞性標籤與中文意義 -->
              <div class="flex items-center justify-center flex-wrap gap-2">
                <!-- 詞性標籤: 1.1rem, 背景色 #e2e8f0, 斜粗體 -->
                <span class="text-[1.1rem] font-bold italic bg-[#e2e8f0] text-slate-700 px-3 py-0.5 rounded-lg">
                  ${item.pos}
                </span>
                <!-- 中文意義: 1.6rem, 緊鄰詞性標籤 -->
                <span class="text-[1.6rem] font-extrabold text-slate-800">
                  ${item.cn}
                </span>
              </div>

              <!-- 3. 策略提示: 💡 策略：[內容] -->
              <div class="text-[1.05rem] font-bold text-slate-600 bg-slate-50 px-4 py-1.5 rounded-xl border border-slate-200/60">
                💡 策略：${item.strategy}
              </div>

              <!-- 4. 記憶口訣方塊: 圓角 20px, 背景色 #ff9800, 文字白色粗體, 字級 1.3rem -->
              <div class="w-full bg-[#ff9800] text-white font-bold text-[1.3rem] rounded-[20px] p-4 shadow-md leading-snug tracking-wide">
                ${item.mnemonic}
              </div>

              <!-- 5. 例句區: 上方灰色細虛線, 1.25rem 灰色斜體 -->
              <div class="w-full pt-3 border-t border-dashed border-slate-300">
                <p class="text-[1.25rem] italic text-slate-500 font-medium leading-relaxed">
                  "${item.ex}"
                </p>
              </div>

            </div>

            <!-- 反面底部切換提示 -->
            <div class="mt-2 text-xs font-bold text-slate-400 flex items-center justify-center space-x-1">
              <i class="fa-solid fa-arrow-rotate-left"></i>
              <span>點擊翻回正面</span>
            </div>

          </div>

        </div>
      `;

      // Click event for card flip
      cardWrapper.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;

        const container = cardWrapper.querySelector('.card-inner');
        const willBeFlipped = !container.classList.contains('is-flipped');
        
        container.classList.toggle('is-flipped');

        // Auto speak on flip if enabled
        if (willBeFlipped && isAutoSpeechEnabled) {
          speakWord(item.en);
        }
      });

      return cardWrapper;
    }

    function renderCards(filterQuery = '') {
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      const query = filterQuery.trim().toLowerCase();
      
      const filteredList = wordList.filter(item => {
        return item.en.toLowerCase().includes(query) || 
               item.cn.toLowerCase().includes(query) ||
               item.mnemonic.toLowerCase().includes(query);
      });

      document.getElementById('total-count').textContent = filteredList.length;

      if (filteredList.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-slate-200">
            <i class="fa-solid fa-circle-exclamation text-4xl text-amber-500 mb-3"></i>
            <p class="text-lg font-bold text-slate-700">找不到符合 "${filterQuery}" 的單字</p>
            <p class="text-xs text-slate-400 mt-1">請重新嘗試其他搜尋關鍵字</p>
          </div>
        `;
        return;
      }

      filteredList.forEach((item, index) => {
        const cardNode = createCardElement(item, index);
        grid.appendChild(cardNode);
      });
    }

    function toggleFlipAll() {
      const containers = document.querySelectorAll('.card-inner');
      isAllFlipped = !isAllFlipped;

      containers.forEach(container => {
        if (isAllFlipped) {
          container.classList.add('is-flipped');
        } else {
          container.classList.remove('is-flipped');
        }
      });

      const flipBtnText = document.getElementById('flip-all-text');
      flipBtnText.textContent = isAllFlipped ? "全部正面" : "全部翻面";
    }

    function toggleAutoSpeech() {
      isAutoSpeechEnabled = !isAutoSpeechEnabled;
      const statusText = document.getElementById('sound-status-text');
      const soundIcon = document.getElementById('sound-icon');
      const soundBtn = document.getElementById('btn-sound-toggle');

      if (isAutoSpeechEnabled) {
        statusText.textContent = "翻面朗讀: 開";
        soundIcon.className = "fa-solid fa-volume-high";
        soundBtn.className = "px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs sm:text-sm font-bold rounded-xl shadow-sm transition-all flex items-center space-x-2";
      } else {
        statusText.textContent = "翻面朗讀: 關";
        soundIcon.className = "fa-solid fa-volume-xmark";
        soundBtn.className = "px-3.5 py-2 bg-slate-400 hover:bg-slate-500 text-white text-xs sm:text-sm font-bold rounded-xl shadow-sm transition-all flex items-center space-x-2";
      }
    }

    // Search Input Event Listener
    document.getElementById('search-input').addEventListener('input', (e) => {
      renderCards(e.target.value);
    });

    // Initialize Page on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderCards();
    });
  </script>
</body>
</html>
